.protected-deploy:
  stage: deploy
  image: docker.io/bitnami/kubectl:1.32.3
  environment:
    name: production
  variables:
    KUBECONFIG: $CI_PROJECT_DIR/.kube/config
  script:
    - ci-cd/scripts/deploy.sh
  needs:
    - job: publish:images
      artifacts: false
    - job: publish:maven
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KUBE_CONFIG_BASE64'
  resource_group: production
  allow_failure: false
