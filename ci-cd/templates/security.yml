.trivy:
  image: docker.io/aquasec/trivy:0.58.1
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - mkdir -p security/reports "$TRIVY_CACHE_DIR"
  cache:
    key: trivy-db
    paths:
      - .trivycache/

.trivy-filesystem:
  extends: .trivy
  stage: security
  script:
    - ci-cd/scripts/trivy-fs.sh
  artifacts:
    expire_in: 30 days
    when: always
    paths:
      - security/reports/

.trivy-config:
  extends: .trivy
  stage: security
  script:
    - ci-cd/scripts/trivy-config.sh
  artifacts:
    expire_in: 30 days
    when: always
    paths:
      - security/reports/

.trivy-image:
  extends: .trivy
  stage: security
  script:
    - ci-cd/scripts/trivy-image.sh "$IMAGE_ARCHIVE" "$IMAGE_REPORT_PREFIX"
  artifacts:
    expire_in: 30 days
    when: always
    paths:
      - security/reports/
