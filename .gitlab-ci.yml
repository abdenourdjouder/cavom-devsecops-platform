include:
  - local: ci-cd/templates/defaults.yml
  - local: ci-cd/templates/validate.yml
  - local: ci-cd/templates/build-test.yml
  - local: ci-cd/templates/quality.yml
  - local: ci-cd/templates/security.yml
  - local: ci-cd/templates/package-publish.yml
  - local: ci-cd/templates/deploy.yml

stages:
  - validate
  - build
  - test
  - quality
  - security
  - package
  - publish
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

validate:project:
  extends: .validate

build:frontend:
  extends: .frontend-build

build:backend:
  extends: .backend-build

test:frontend:
  extends: .frontend-test

test:backend:
  extends: .backend-test

quality:sonar:
  extends: .sonar-quality

security:filesystem:
  extends: .trivy-filesystem

security:dependencies:
  extends: .trivy-dependencies

security:secrets:
  extends: .trivy-secrets

security:config:
  extends: .trivy-config

build:frontend-image:
  extends: .frontend-image

build:backend-image:
  extends: .backend-image

security:frontend-image:
  extends: .trivy-image
  variables:
    IMAGE_ARCHIVE: .oci/frontend.tar
    IMAGE_REPORT_PREFIX: frontend
  needs:
    - job: build:frontend-image
      artifacts: true

security:backend-image:
  extends: .trivy-image
  variables:
    IMAGE_ARCHIVE: .oci/backend.tar
    IMAGE_REPORT_PREFIX: backend
  needs:
    - job: build:backend-image
      artifacts: true

package:images:
  extends: .image-package

publish:maven:
  extends: .maven-publish

publish:images:
  extends: .image-publish
  needs:
    - job: package:images
      artifacts: true

deploy:production:
  extends: .protected-deploy
