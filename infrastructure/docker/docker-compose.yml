name: cavom-devsecops

services:
  gitlab:
    image: gitlab/gitlab-ce:18.1.2-ce.0
    hostname: gitlab
    restart: unless-stopped
    shm_size: 1gb
    environment:
      GITLAB_EXTERNAL_URL: ${GITLAB_EXTERNAL_URL:-http://gitlab.localhost:8080}
      GITLAB_REGISTRY_EXTERNAL_URL: ${GITLAB_REGISTRY_EXTERNAL_URL:-http://registry.localhost:5050}
      GITLAB_SSH_PORT: ${GITLAB_SSH_PORT:-2222}
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?Set GITLAB_ROOT_PASSWORD in .env}
    volumes:
      - ./gitlab/gitlab.rb:/etc/gitlab/gitlab.rb:ro
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    ports:
      - "127.0.0.1:${GITLAB_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${GITLAB_SSH_PORT:-2222}:22"
      - "127.0.0.1:${GITLAB_REGISTRY_PORT:-5050}:5050"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1/-/readiness?all=1 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    stop_grace_period: 90s

  runner:
    image: gitlab/gitlab-runner:v18.1.0
    restart: unless-stopped
    entrypoint: ["gitlab-runner"]
    command:
      - run
      - --config=/etc/gitlab-runner/config.toml
      - --working-directory=/workspace
      - --listen-address=0.0.0.0:9252
    user: "1000:1000"
    environment:
      HOME: /home/gitlab-runner
      BUILDKIT_HOST: unix:///run/buildkit/buildkitd.sock
    volumes:
      - ${GITLAB_RUNNER_CONFIG:-./runner/config.toml.example}:/etc/gitlab-runner/config.toml:ro
      - runner-home:/home/gitlab-runner
      - buildkit-socket:/run/buildkit
    tmpfs:
      - /workspace:uid=1000,gid=1000,mode=0700
    depends_on:
      gitlab:
        condition: service_healthy
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9252/metrics >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  sonarqube:
    image: sonarqube:2025.1.3-community
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-postgres:5432/${POSTGRES_DB:-sonar}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "false"
    volumes:
      - ./sonarqube/sonar.properties:/opt/sonarqube/conf/sonar.properties:ro
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ports:
      - "127.0.0.1:${SONARQUBE_HTTP_PORT:-9000}:9000"
    depends_on:
      sonarqube-postgres:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    stop_grace_period: 90s

  sonarqube-postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_DB: ${POSTGRES_DB:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - sonarqube-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  buildkit-rootless:
    image: moby/buildkit:v0.23.2-rootless
    profiles: ["buildkit"]
    restart: unless-stopped
    user: "1000:1000"
    environment:
      BUILDKITD_FLAGS: --addr unix:///run/buildkit/buildkitd.sock
    volumes:
      - buildkit-state:/home/user/.local/share/buildkit
      - buildkit-socket:/run/buildkit
    networks:
      - edge
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/buildkit/buildkitd.sock"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  edge:
    name: cavom-devsecops-edge
    driver: bridge
  backend:
    name: cavom-devsecops-backend
    driver: bridge
    internal: true

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-home:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-postgres-data:
  buildkit-state:
  buildkit-socket:
