# TEMPLATE ONLY. Requires External Secrets Operator, an existing
# ClusterSecretStore named cavom-secret-store, and a remote value containing a
# complete Docker config JSON object. This file is not part of kustomize.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-regcred
  namespace: cavom-frontend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cavom-secret-store
  target:
    name: gitlab-regcred
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: PLACEHOLDER_GITLAB_PULL_SECRET_PATH
        property: dockerconfigjson
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-regcred
  namespace: cavom-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cavom-secret-store
  target:
    name: gitlab-regcred
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: PLACEHOLDER_GITLAB_PULL_SECRET_PATH
        property: dockerconfigjson
