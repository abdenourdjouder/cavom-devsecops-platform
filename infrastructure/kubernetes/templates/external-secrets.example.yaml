# TEMPLATE ONLY. Requires External Secrets Operator and an existing
# ClusterSecretStore named cavom-secret-store. This file is intentionally not
# included in kustomization.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: cavom-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cavom-secret-store
  target:
    name: database-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: PLACEHOLDER_DATABASE_SECRET_PATH
        property: username
    - secretKey: password
      remoteRef:
        key: PLACEHOLDER_DATABASE_SECRET_PATH
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: cavom-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cavom-secret-store
  target:
    name: database-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: PLACEHOLDER_DATABASE_SECRET_PATH
        property: username
    - secretKey: password
      remoteRef:
        key: PLACEHOLDER_DATABASE_SECRET_PATH
        property: password
    - secretKey: root-password
      remoteRef:
        key: PLACEHOLDER_DATABASE_SECRET_PATH
        property: root-password
