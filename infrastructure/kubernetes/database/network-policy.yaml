apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cavom-database
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql
  namespace: cavom-database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cavom-backend
          podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - port: 3306
          protocol: TCP
